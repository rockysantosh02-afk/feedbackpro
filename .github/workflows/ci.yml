name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-security:
    name: Backend Tests, Security & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pip-audit

      - name: Run Backend Unit & Security Tests
        run: |
          cd backend
          python -m pytest -v tests

      - name: Run Standalone Security Checks
        run: |
          python scripts/security_check.py

      - name: Run Secret Scanner
        run: |
          python scripts/verify_secret_scan.py

      - name: Validate Fresh Database Migrations
        run: |
          python scripts/verify_migrations_fresh.py

      - name: Run Pip Audit (Dependency Security)
        run: |
          python -m pip_audit -r backend/requirements.txt

  frontend-build-and-audit:
    name: Frontend Build & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Dependency Audit
        run: |
          cd frontend
          npm audit --audit-level=critical

      - name: Frontend Production Build
        run: |
          cd frontend
          npm run build
