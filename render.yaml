services:
  # 1. FastAPI Web API Service
  - type: web
    name: feedbackpro-api
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install .
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: feedbackpro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: deterministic # or openai / gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://feedbackpro.onrender.com
      - key: BACKEND_URL
        value: https://feedbackpro-api.onrender.com
      - key: FIREBASE_PROJECT_ID
        value: feedbackpro-d2e02
      - key: FIREBASE_AUTH_ENABLED
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # 2. Dedicated Isolated Audit Worker
  - type: worker
    name: feedbackpro-audit-worker
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install . && playwright install chromium --with-deps
    startCommand: python -m app.workers.audit_worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: feedbackpro-db
          property: connectionString
      - key: AI_PROVIDER
        value: deterministic # or openai / gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 3. React Frontend Static Site
  - type: web
    name: feedbackpro-frontend
    runtime: static
    rootDir: frontend
    plan: standard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://feedbackpro-api.onrender.com/api
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: feedbackpro-d2e02.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: feedbackpro-d2e02
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: feedbackpro-d2e02.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "173752906033"
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-RCBSH3WWEB

databases:
  # Managed PostgreSQL instance
  - name: feedbackpro-db
    plan: standard
    postgresMajorVersion: 16
